name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > chameleonultragui/android/app/upload-keystore.jks
          cat > chameleonultragui/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build APKs
        working-directory: chameleonultragui
        run: |
          flutter pub get
          flutter build apk --release --dart-define=AMAP_KEY=${{ secrets.AMAP_KEY }} --dart-define=AMAP_KEY_IOS=${{ secrets.AMAP_KEY_IOS }}
          flutter build apk --release --split-per-abi --dart-define=AMAP_KEY=${{ secrets.AMAP_KEY }} --dart-define=AMAP_KEY_IOS=${{ secrets.AMAP_KEY_IOS }}
      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chameleonultragui/build/app/outputs/flutter-apk/app-release.apk
            chameleonultragui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            chameleonultragui/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            chameleonultragui/build/app/outputs/flutter-apk/app-x86_64-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows
        working-directory: chameleonultragui
        run: |
          flutter pub get
          flutter build windows --release --dart-define=AMAP_KEY=${{ secrets.AMAP_KEY }}
      - name: Package zip
        shell: pwsh
        run: |
          cd chameleonultragui
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../chameleonultragui-windows.zip
      - name: Upload Windows zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: chameleonultragui-windows.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build iOS (no codesign)
        working-directory: chameleonultragui
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=AMAP_KEY=${{ secrets.AMAP_KEY }} --dart-define=AMAP_KEY_IOS=${{ secrets.AMAP_KEY_IOS }}
      - name: Package unsigned IPA
        run: |
          cd chameleonultragui
          mkdir -p ../ios_build/Payload
          cp -r build/ios/iphoneos/Runner.app ../ios_build/Payload/
          cd ../ios_build
          zip -qr ../chameleonultragui-ios.ipa Payload
      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          files: chameleonultragui-ios.ipa
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install pod build deps
        run: brew install automake libtool
      - name: Build macOS
        working-directory: chameleonultragui
        run: |
          flutter pub get
          flutter build macos --release --dart-define=AMAP_KEY=${{ secrets.AMAP_KEY }} --dart-define=AMAP_KEY_IOS=${{ secrets.AMAP_KEY_IOS }}
      - name: Package DMG
        run: |
          cd chameleonultragui/build/macos/Build/Products/Release
          hdiutil create -volname "ChameleonUltraGUI-mazha0309" \
            -srcfolder Runner.app \
            -ov -format UDZO ../../../../../../ChameleonUltraGUI-mazha0309-macos.dmg
      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: chameleonultragui/ChameleonUltraGUI-mazha0309-macos.dmg
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build file imagemagick
      - name: Build Linux
        working-directory: chameleonultragui
        run: |
          flutter pub get
          flutter build linux --release --dart-define=AMAP_KEY=${{ secrets.AMAP_KEY }}
      - name: Package tar.gz fallback
        run: |
          cd chameleonultragui/build/linux/x64/release
          tar czf ../../../../ChameleonUltraGUI-mazha0309-linux-x64.tar.gz bundle
      - name: Upload Linux tar.gz to Release
        uses: softprops/action-gh-release@v2
        with:
          files: chameleonultragui/ChameleonUltraGUI-mazha0309-linux-x64.tar.gz
